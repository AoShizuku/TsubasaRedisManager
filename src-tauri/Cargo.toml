[package]
name = "tsubasa-redis-manager"
version = "0.1.0"
description = "The Tauri backend for Tsubasa Redis Manager"
authors = ["AoShizuku"]
license = "MIT"
repository = "https://github.com/AoShizuku/TsubasaRedisManager"
edition = "2021"
publish = false

[lib]
name = "tsubasa_redis_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tsubasa-redis-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
brotli = "8"
flate2 = "1"
fontdb = "0.23"
futures-util = "0.3"
keyring = "4.1.5"
redis = { version = "1", features = ["tokio-comp", "connection-manager", "cluster-async", "sentinel", "tokio-rustls-comp", "tls-rustls-insecure"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
russh = { version = "0.61", default-features = false, features = ["flate2", "ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
